services:
  - type: web
    name: voxelcraft-server
    runtime: node
    # Free plan: no persistent disk. Durable state is mirrored to Turso
    # (free tier) by remote-store.js; set the two TURSO_* variables in the
    # Render dashboard and the server restores them on every boot.
    plan: free
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.22.3"
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/data
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
