services:
  - type: web
    name: voxelcraft-server
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: voxelcraft-data
      mountPath: /var/data
      sizeGB: 1
